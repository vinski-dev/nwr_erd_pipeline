name: "nwr_erd_pipeline"
version: "1.0.0"
config-version: 2
flags:
  silence_deprecations:
    - MissingArgumentsPropertyInGenericTestDeprecation

# This tells dbt to look for the "nwr_erd_pipeline" block in your profiles.yml
  require_generic_test_arguments_property: true
profile: "nwr_erd_pipeline"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

models:
  nwr_erd_pipeline: # Replace with the actual project name from the top of your file

    # Your existing Silver configuration
    silver:
      +schema: silver
      +materialized: table

      staging:
        +materialized: view

      intermediate:
        +materialized: table

    # Add this new block for the Gold layer
    gold:
      +schema: gold
      +materialized: table