name: dbt Production Deployment

on:
  push:
    branches:
      - main

jobs:
  dbt-deploy:
    name: Run dbt build in Production
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./nwr_erd_pipeline

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dbt for BigQuery
        run: pip install dbt-bigquery

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Create Production profiles.yml
        run: |
          cat <<EOF > profiles.yml
          nwr_erd_pipeline:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: oauth
                project: nwr-data-platform
                dataset: dbt_erd_nwr_prod
                location: US
                threads: 4
          EOF

      - name: Install dbt Dependencies
        run: dbt deps

      - name: Deploy to Production
        run: dbt build
        env:
          DBT_PROFILES_DIR: .
