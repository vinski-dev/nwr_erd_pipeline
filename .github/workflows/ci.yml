name: dbt CI/CD

on:
  push:
    branches:
      - "**" # Triggers on all branches

jobs:
  run-dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-bigquery

      - name: Setup dbt Profile and Credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
              TARGET_DATASET="dbt_erd_nwr_prod"
          else
              TARGET_DATASET="dbt_erd_nwr_staging"
          fi
          echo "Building into dataset: $TARGET_DATASET"

          mkdir -p ~/.dbt
          # Save the key file to an absolute, unmoving path
          echo "$GCP_SA_KEY" > ~/.dbt/gcp_key.json

          cat <<EOF > ~/.dbt/profiles.yml
          nwr_erd_pipeline:
              target: ci
              outputs:
              ci:
                  type: bigquery
                  method: service-account
                  project: nwr-data-platform
                  dataset: $TARGET_DATASET
                  threads: 4
                  keyfile: /home/runner/.dbt/gcp_key.json
          EOF
