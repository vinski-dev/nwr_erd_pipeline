stages:
  - dbt-pipeline

run-dbt-build:
  stage: dbt-pipeline
  image: python:3.10-slim

  before_script:
    - pip install --upgrade pip
    - pip install dbt-bigquery

    # 1. Determine the target dataset based on the Git branch
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        TARGET_DATASET="dbt_erd_nwr_prod"
      else
        TARGET_DATASET="dbt_erd_nwr_staging"
      fi
      echo "Building into dataset: $TARGET_DATASET"

    # 2. Dynamically generate profiles.yml and point directly to the GitLab File variable
    - mkdir -p ~/.dbt
    - |
      cat <<EOF > ~/.dbt/profiles.yml
      nwr_erd_pipeline:
        target: ci
        outputs:
          ci:
            type: bigquery
            method: service-account
            project: nwr-data-platform
            dataset: $TARGET_DATASET
            threads: 4
            keyfile: $GCP_SA_KEY
      EOF

  script:
    - dbt deps
    - dbt build --target ci
